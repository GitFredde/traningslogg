<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Träningslogg</title>
<style>
  :root {
    --bg: #1a1a1a;
    --card: #2a2a2a;
    --card-2: #232323;
    --accent: #ff8c00;
    --text: #eaeaea;
    --text-dim: #9a9a9a;
    --border: #3a3a3a;
    --danger: #ff5c5c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding-bottom: 40px;
  }
  header {
    padding: 18px 16px 10px;
    text-align: center;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    font-size: 1.15rem;
    margin: 0 0 12px;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .week-nav button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 1.1rem;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    cursor: pointer;
  }
  .week-label {
    min-width: 140px;
    font-weight: 600;
    font-size: 1rem;
  }
  .today-btn {
    display: block;
    margin: 8px auto 0;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.8rem;
    text-decoration: underline;
    cursor: pointer;
  }
  .day-tabs {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 12px 16px 0;
    scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex: 1 0 auto;
    text-align: center;
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    font-size: 0.82rem;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
  }
  .day-tab.active {
    background: var(--accent);
    color: #1a1a1a;
    border-color: var(--accent);
    font-weight: 600;
  }
  .day-tab .dsub { display: block; font-size: 0.65rem; opacity: 0.8; }
  main {
    padding: 16px;
    max-width: 560px;
    margin: 0 auto;
  }
  .category {
    background: var(--card);
    border-radius: 14px;
    margin-bottom: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .category-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 14px;
    background: var(--card-2);
    border-bottom: 1px solid var(--border);
  }
  .category-header .cat-name {
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .category-header .cat-totals {
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: 600;
  }
  .exercise {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .exercise:last-child { border-bottom: none; }
  .exercise-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .exercise-name { font-size: 0.95rem; }
  .exercise-week-total {
    font-size: 0.72rem;
    color: var(--text-dim);
  }
  .set-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
    min-height: 26px;
  }
  .chip {
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chip button {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 0.85rem;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }
  .add-set-row {
    display: flex;
    gap: 8px;
  }
  .add-set-row input {
    flex: 1;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 0.95rem;
  }
  .add-set-row button {
    background: var(--accent);
    border: none;
    color: #1a1a1a;
    font-weight: 700;
    border-radius: 8px;
    padding: 0 16px;
    font-size: 1rem;
    cursor: pointer;
  }
  .add-exercise {
    padding: 10px 14px;
    text-align: center;
  }
  .add-exercise button {
    background: none;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.8rem;
    width: 100%;
    cursor: pointer;
  }
  .summary-toggle {
    text-align: center;
    margin: 20px 0 8px;
  }
  .summary-toggle button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .summary {
    display: none;
  }
  .summary.open { display: block; }
  .summary h2 {
    font-size: 1rem;
    text-align: center;
    color: var(--text-dim);
    font-weight: 500;
    margin: 4px 0 12px;
  }
  table.summary-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  table.summary-table td, table.summary-table th {
    padding: 6px 4px;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }
  table.summary-table th:first-child, table.summary-table td:first-child {
    text-align: left;
  }
  table.summary-table th { color: var(--text-dim); font-weight: 500; font-size: 0.75rem; }
  tr.cat-row td {
    font-weight: 700;
    color: var(--accent);
    background: var(--card-2);
  }
  .footer-note {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.72rem;
    margin-top: 24px;
    line-height: 1.5;
    padding: 0 20px;
  }
</style>
</head>
<body>

<header>
  <h1>Träningslogg</h1>
  <div class="week-nav">
    <button id="prevWeek">‹</button>
    <div class="week-label" id="weekLabel">Vecka –</div>
    <button id="nextWeek">›</button>
  </div>
  <button class="today-btn" id="jumpToday">Hoppa till idag</button>
  <div class="day-tabs" id="dayTabs"></div>
</header>

<main>
  <div id="categories"></div>

  <div class="summary-toggle">
    <button id="toggleSummary">Visa veckans summering ▾</button>
  </div>
  <div class="summary" id="summaryBlock">
    <h2 id="summaryWeekLabel"></h2>
    <table class="summary-table">
      <thead>
        <tr><th>Övning</th><th>Summa</th><th>Antal set</th></tr>
      </thead>
      <tbody id="summaryBody"></tbody>
    </table>
  </div>

  <div class="footer-note">
    Data sparas lokalt i den här webbläsaren. Om du byter enhet eller rensar webbläsardata försvinner loggen från den enheten.
  </div>
</main>

<script>
(function() {
  "use strict";

  // ---------- Storage layer (localStorage with in-memory fallback) ----------
  const STORAGE_KEY = "traningslogg_v1";
  let memoryFallback = null;
  let storageWorks = true;
  try {
    const t = "__test__";
    localStorage.setItem(t, "1");
    localStorage.removeItem(t);
  } catch (e) {
    storageWorks = false;
  }

  function loadData() {
    if (storageWorks) {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { /* fall through */ }
    }
    if (memoryFallback) return memoryFallback;
    return defaultData();
  }

  function saveData(data) {
    if (storageWorks) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return;
      } catch (e) { /* fall through to memory */ }
    }
    memoryFallback = data;
  }

  function defaultData() {
    return {
      exercises: {
        "Tryck": ["Armhävningar", "Dips"],
        "Drag": ["Chins", "Rodd"],
        "Ben": ["Knäböj", "Enbensböj", "Utfall"],
        "Core": ["Axeltaps", "Planka"]
      },
      weeks: {}
    };
  }

  let data = loadData();
  // Make sure structure is sane even if old data is malformed
  if (!data.exercises) data.exercises = defaultData().exercises;
  if (!data.weeks) data.weeks = {};

  // ---------- Date / ISO week helpers ----------
  const DAYS = ["Mån", "Tis", "Ons", "Tor", "Fre", "Lör", "Sön"];

  function isoWeekInfo(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = (d.getUTCDay() + 6) % 7; // Mon=0..Sun=6
    d.setUTCDate(d.getUTCDate() - dayNum + 3); // Thursday of this week
    const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
    const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
    firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
    const week = 1 + Math.round((d - firstThursday) / (7 * 86400000));
    return { year: d.getUTCFullYear(), week: week };
  }

  function weekKey(date) {
    const info = isoWeekInfo(date);
    return info.year + "-W" + String(info.week).padStart(2, "0");
  }

  function mondayOf(date) {
    const d = new Date(date);
    const dayNum = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - dayNum);
    d.setHours(0,0,0,0);
    return d;
  }

  function fmtShort(date) {
    return date.getDate() + "/" + (date.getMonth() + 1);
  }

  // ---------- App state ----------
  let viewDate = new Date(); // any date within the viewed week
  let activeDayIndex = (function() {
    const n = (new Date().getDay() + 6) % 7;
    return n;
  })();

  function currentWeekKey() {
    return weekKey(viewDate);
  }

  function ensureWeek(key) {
    if (!data.weeks[key]) data.weeks[key] = {};
    return data.weeks[key];
  }

  function getDayData(dayLabel) {
    const wk = ensureWeek(currentWeekKey());
    if (!wk[dayLabel]) wk[dayLabel] = {};
    return wk[dayLabel];
  }

  // ---------- Rendering ----------
  const dayTabsEl = document.getElementById("dayTabs");
  const weekLabelEl = document.getElementById("weekLabel");
  const categoriesEl = document.getElementById("categories");
  const summaryBody = document.getElementById("summaryBody");
  const summaryWeekLabelEl = document.getElementById("summaryWeekLabel");

  function render() {
    renderWeekLabel();
    renderDayTabs();
    renderCategories();
    renderSummary();
  }

  function renderWeekLabel() {
    const info = isoWeekInfo(viewDate);
    weekLabelEl.textContent = "Vecka " + info.week + ", " + info.year;
  }

  function renderDayTabs() {
    dayTabsEl.innerHTML = "";
    const mon = mondayOf(viewDate);
    DAYS.forEach((label, idx) => {
      const d = new Date(mon);
      d.setDate(mon.getDate() + idx);
      const tab = document.createElement("div");
      tab.className = "day-tab" + (idx === activeDayIndex ? " active" : "");
      tab.innerHTML = label + '<span class="dsub">' + fmtShort(d) + "</span>";
      tab.addEventListener("click", () => {
        activeDayIndex = idx;
        render();
      });
      dayTabsEl.appendChild(tab);
    });
  }

  function weekTotalsForExercise(exName) {
    const wk = data.weeks[currentWeekKey()] || {};
    let sum = 0, sets = 0;
    DAYS.forEach(day => {
      const arr = (wk[day] && wk[day][exName]) || [];
      arr.forEach(v => { sum += v; sets += 1; });
    });
    return { sum, sets };
  }

  function renderCategories() {
    categoriesEl.innerHTML = "";
    const dayLabel = DAYS[activeDayIndex];
    const dayData = getDayData(dayLabel);

    Object.keys(data.exercises).forEach(catName => {
      const exList = data.exercises[catName];

      // category totals for the week
      let catSum = 0, catSets = 0;
      exList.forEach(ex => {
        const t = weekTotalsForExercise(ex);
        catSum += t.sum; catSets += t.sets;
      });

      const catEl = document.createElement("div");
      catEl.className = "category";

      const header = document.createElement("div");
      header.className = "category-header";
      header.innerHTML = '<span class="cat-name">' + catName + '</span>' +
        '<span class="cat-totals">' + catSum + ' reps · ' + catSets + ' set</span>';
      catEl.appendChild(header);

      exList.forEach(exName => {
        const exEl = document.createElement("div");
        exEl.className = "exercise";

        const t = weekTotalsForExercise(exName);
        const top = document.createElement("div");
        top.className = "exercise-top";
        top.innerHTML = '<span class="exercise-name">' + exName + '</span>' +
          '<span class="exercise-week-total">' + t.sum + ' reps · ' + t.sets + ' set (v.)</span>';
        exEl.appendChild(top);

        const chipsWrap = document.createElement("div");
        chipsWrap.className = "set-chips";
        const sets = dayData[exName] || [];
        sets.forEach((val, i) => {
          const chip = document.createElement("div");
          chip.className = "chip";
          chip.innerHTML = "<span>" + val + "</span>";
          const rm = document.createElement("button");
          rm.textContent = "✕";
          rm.addEventListener("click", () => {
            sets.splice(i, 1);
            dayData[exName] = sets;
            saveData(data);
            render();
          });
          chip.appendChild(rm);
          chipsWrap.appendChild(chip);
        });
        exEl.appendChild(chipsWrap);

        const addRow = document.createElement("div");
        addRow.className = "add-set-row";
        const input = document.createElement("input");
        input.type = "number";
        input.inputMode = "numeric";
        input.placeholder = "Reps";
        const addBtn = document.createElement("button");
        addBtn.textContent = "+";
        function commit() {
          const val = parseInt(input.value, 10);
          if (!isNaN(val) && val >= 0) {
            const arr = dayData[exName] || [];
            arr.push(val);
            dayData[exName] = arr;
            saveData(data);
            input.value = "";
            render();
          }
        }
        addBtn.addEventListener("click", commit);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") commit(); });
        addRow.appendChild(input);
        addRow.appendChild(addBtn);
        exEl.appendChild(addRow);

        catEl.appendChild(exEl);
      });

      const addExRow = document.createElement("div");
      addExRow.className = "add-exercise";
      const addExBtn = document.createElement("button");
      addExBtn.textContent = "+ Lägg till övning i " + catName;
      addExBtn.addEventListener("click", () => {
        const name = prompt("Namn på ny övning i " + catName + ":");
        if (name && name.trim()) {
          data.exercises[catName].push(name.trim());
          saveData(data);
          render();
        }
      });
      addExRow.appendChild(addExBtn);
      catEl.appendChild(addExRow);

      categoriesEl.appendChild(catEl);
    });
  }

  function renderSummary() {
    const info = isoWeekInfo(viewDate);
    summaryWeekLabelEl.textContent = "Vecka " + info.week + ", " + info.year;
    summaryBody.innerHTML = "";
    Object.keys(data.exercises).forEach(catName => {
      const exList = data.exercises[catName];
      let catSum = 0, catSets = 0;
      exList.forEach(exName => {
        const t = weekTotalsForExercise(exName);
        catSum += t.sum; catSets += t.sets;
        const row = document.createElement("tr");
        row.innerHTML = "<td>" + exName + "</td><td>" + t.sum + "</td><td>" + t.sets + "</td>";
        summaryBody.appendChild(row);
      });
      const catRow = document.createElement("tr");
      catRow.className = "cat-row";
      catRow.innerHTML = "<td>" + catName + "</td><td>" + catSum + "</td><td>" + catSets + "</td>";
      summaryBody.appendChild(catRow);
    });
  }

  // ---------- Controls ----------
  document.getElementById("prevWeek").addEventListener("click", () => {
    viewDate.setDate(viewDate.getDate() - 7);
    viewDate = new Date(viewDate);
    render();
  });
  document.getElementById("nextWeek").addEventListener("click", () => {
    viewDate.setDate(viewDate.getDate() + 7);
    viewDate = new Date(viewDate);
    render();
  });
  document.getElementById("jumpToday").addEventListener("click", () => {
    viewDate = new Date();
    activeDayIndex = (new Date().getDay() + 6) % 7;
    render();
  });
  document.getElementById("toggleSummary").addEventListener("click", (e) => {
    const block = document.getElementById("summaryBlock");
    block.classList.toggle("open");
    e.target.textContent = block.classList.contains("open")
      ? "Dölj veckans summering ▴"
      : "Visa veckans summering ▾";
  });

  render();
})();
</script>

</body>
</html>
