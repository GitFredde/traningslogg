<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Träningslogg</title>

<!-- PWA / fullscreen home-screen support -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Träningslogg">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #1a1a1a;
    --card: #2a2a2a;
    --card-2: #232323;
    --accent: #ff8c00;
    --text: #eaeaea;
    --text-dim: #9a9a9a;
    --border: #3a3a3a;
    --danger: #ff5c5c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding-bottom: 40px;
  }
  header {
    padding: 18px 16px 10px;
    text-align: center;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    font-size: 1.15rem;
    margin: 0 0 12px;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .week-nav button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 1.1rem;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    cursor: pointer;
  }
  .week-label {
    min-width: 140px;
    font-weight: 600;
    font-size: 1rem;
  }
  .today-btn {
    display: block;
    margin: 8px auto 0;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.8rem;
    text-decoration: underline;
    cursor: pointer;
  }
  .day-tabs {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 12px 16px 0;
    scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex: 1 0 auto;
    text-align: center;
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    font-size: 0.82rem;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    position: relative;
  }
  .day-tab.active {
    background: var(--accent);
    color: #1a1a1a;
    border-color: var(--accent);
    font-weight: 600;
  }
  .day-tab.is-today {
    box-shadow: 0 0 0 2px rgba(234,234,234,0.85) inset;
  }
  .day-tab .dsub { display: block; font-size: 0.65rem; opacity: 0.8; }
  .day-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #5ec26a;
    margin-left: 4px;
    vertical-align: middle;
  }
  .day-tab.active .day-dot {
    background: #1a1a1a;
  }
  main {
    padding: 16px;
    max-width: 560px;
    margin: 0 auto;
  }
  .category {
    background: var(--card);
    border-radius: 14px;
    margin-bottom: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .category-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 14px;
    background: var(--card-2);
    border-bottom: 1px solid var(--border);
  }
  .category-header .cat-name {
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .category-header .cat-totals {
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: 600;
  }
  .exercise {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .exercise:last-child { border-bottom: none; }
  .exercise-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
  }
  .exercise-name { font-size: 0.95rem; flex: 1; }
  .exercise-week-total {
    font-size: 0.72rem;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .remove-ex-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.9rem;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
    flex-shrink: 0;
  }
  .remove-ex-btn:hover { color: var(--danger); }
  .archived-wrap {
    border-top: 1px solid var(--border);
    padding: 8px 14px;
  }
  .archived-toggle {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.75rem;
    cursor: pointer;
    padding: 4px 0;
    width: 100%;
    text-align: left;
  }
  .archived-body { padding-top: 6px; }
  .archived-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 0.82rem;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .archived-row:last-child { border-bottom: none; }
  .archived-btn-group {
    display: flex;
    gap: 6px;
  }
  .archived-row button {
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--accent);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.72rem;
    cursor: pointer;
  }
  .archived-row button.purge-btn {
    color: var(--danger);
    border-color: var(--danger);
  }
  .set-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
    min-height: 26px;
  }
  .chip {
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chip button {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 0.85rem;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }
  .add-set-row {
    display: flex;
    gap: 8px;
  }
  .add-set-row input {
    flex: 1;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 0.95rem;
  }
  .add-set-row button {
    background: var(--accent);
    border: none;
    color: #1a1a1a;
    font-weight: 700;
    border-radius: 8px;
    padding: 0 16px;
    font-size: 1rem;
    cursor: pointer;
  }
  .add-exercise {
    padding: 10px 14px;
    text-align: center;
  }
  .add-exercise button {
    background: none;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.8rem;
    width: 100%;
    cursor: pointer;
  }
  .summary-toggle {
    text-align: center;
    margin: 20px 0 8px;
  }
  .summary-toggle button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .summary {
    display: none;
  }
  .summary.open { display: block; }
  .summary h2 {
    font-size: 1rem;
    text-align: center;
    color: var(--text-dim);
    font-weight: 500;
    margin: 4px 0 12px;
  }
  table.summary-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  table.summary-table td, table.summary-table th {
    padding: 6px 4px;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }
  table.summary-table th:first-child, table.summary-table td:first-child {
    text-align: left;
  }
  table.summary-table th { color: var(--text-dim); font-weight: 500; font-size: 0.75rem; }
  tr.cat-row td {
    font-weight: 700;
    color: var(--accent);
    background: var(--card-2);
  }
  .footer-note {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.72rem;
    margin-top: 24px;
    line-height: 1.5;
    padding: 0 20px;
  }

  /* ---------- Top-level nav ---------- */
  .top-nav {
    display: flex;
    gap: 8px;
    padding: 14px 16px 0;
    max-width: 560px;
    margin: 0 auto;
  }
  .top-nav-btn {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 10px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .top-nav-btn.active {
    background: var(--accent);
    color: #1a1a1a;
    border-color: var(--accent);
  }

  /* ---------- Stats view ---------- */
  .range-tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 4px;
  }
  .range-tab {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .range-tab.active {
    background: var(--accent);
    color: #1a1a1a;
    border-color: var(--accent);
    font-weight: 700;
  }
  .section-title {
    font-size: 0.95rem;
    color: var(--text-dim);
    font-weight: 600;
    margin: 22px 4px 10px;
  }
  .chart-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 10px;
    position: relative;
    height: 240px;
  }
  .stat-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 4px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .stat-card .sc-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .stat-card .sc-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .stat-card .sc-value {
    font-size: 1.3rem;
    font-weight: 700;
  }
  .stat-card .sc-delta {
    font-size: 0.72rem;
    margin-top: 2px;
  }
  .sc-delta.up { color: #5ec26a; }
  .sc-delta.down { color: var(--danger); }
  .sc-delta.flat { color: var(--text-dim); }

  /* ---------- Per-exercise progression cards ---------- */
  .ex-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .ex-card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .ex-card-top .ex-title {
    font-weight: 600;
    font-size: 0.9rem;
  }
  .ex-card-top .ex-pr {
    font-size: 0.72rem;
    color: var(--accent);
    text-align: right;
  }
  .ex-card .ex-chart-wrap {
    height: 90px;
    position: relative;
  }
</style>
</head>
<body>

<div class="top-nav">
  <button class="top-nav-btn active" id="navLog">Logg</button>
  <button class="top-nav-btn" id="navStats">Statistik</button>
</div>

<div id="logView">
<header>
  <h1>Träningslogg</h1>
  <div class="week-nav">
    <button id="prevWeek">‹</button>
    <div class="week-label" id="weekLabel">Vecka –</div>
    <button id="nextWeek">›</button>
  </div>
  <button class="today-btn" id="jumpToday">Hoppa till idag</button>
  <div class="day-tabs" id="dayTabs"></div>
  <div id="syncIndicator" style="text-align:center;font-size:0.68rem;color:var(--text-dim);margin-top:8px;"></div>
</header>

<main>
  <div id="categories"></div>

  <div class="summary-toggle">
    <button id="toggleSummary">Visa veckans summering ▾</button>
  </div>
  <div class="summary" id="summaryBlock">
    <h2 id="summaryWeekLabel"></h2>
    <table class="summary-table">
      <thead>
        <tr><th>Övning</th><th>Summa</th><th>Antal set</th></tr>
      </thead>
      <tbody id="summaryBody"></tbody>
    </table>
  </div>
</main>
</div>

<div id="statsView" style="display:none;">
  <header>
    <h1>Statistik</h1>
    <div class="range-tabs" id="rangeTabs">
      <button class="range-tab" data-range="4">4 veckor</button>
      <button class="range-tab active" data-range="10">10 veckor</button>
      <button class="range-tab" data-range="year">Hela året</button>
    </div>
  </header>

  <main>
    <h2 class="section-title">Antal set per kategori</h2>
    <div class="chart-wrap"><canvas id="setsChart"></canvas></div>

    <h2 class="section-title">Antal reps per kategori</h2>
    <div class="chart-wrap"><canvas id="repsChart"></canvas></div>

    <div class="summary-toggle">
      <button id="toggleStatsTable">Visa veckotabell ▾</button>
    </div>
    <div class="summary" id="statsTableBlock">
      <table class="summary-table" id="statsTable"></table>
    </div>

    <div class="summary-toggle">
      <button id="toggleExerciseStats">Progression per övning ▾</button>
    </div>
    <div class="summary" id="exerciseStatsBlock">
      <div id="exerciseCards"></div>
    </div>

    <div class="footer-note">
      Statistiken utgår från dagens datum, oavsett vilken vecka du bläddrat till i Logg-vyn.
    </div>
  </main>
</div>

<script>
(function() {
  "use strict";

  // ---------- Supabase config ----------
  // Fyll i dina egna värden här (Settings → API i Supabase-projektet).
  const SUPABASE_URL = "https://xzgyrsghhjikrthfqooc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_-jVPmLBS4TIroesTXjxRLw_I9hGrDeL";
  const RECORD_ID = "fredrik"; // en rad i tabellen räcker för en användare

  let supabaseClient = null;
  let supabaseReady = false;
  if (SUPABASE_URL.indexOf("https://") === 0 && SUPABASE_ANON_KEY.length > 20) {
    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      supabaseReady = true;
    } catch (e) {
      console.warn("Kunde inte skapa Supabase-klient:", e);
    }
  }

  const syncIndicator = document.getElementById("syncIndicator");
  function setSyncStatus(status) {
    // status: "offline" | "synced" | "syncing" | "error"
    if (!syncIndicator) return;
    const map = {
      offline: "● Endast lokalt",
      synced: "● Synkad",
      syncing: "● Synkar…",
      error: "● Synk misslyckades"
    };
    syncIndicator.textContent = map[status] || "";
    syncIndicator.dataset.status = status;
  }

  // ---------- Storage layer (localStorage cache + Supabase sync) ----------
  const STORAGE_KEY = "traningslogg_v1";
  let memoryFallback = null;
  let storageWorks = true;
  try {
    const t = "__test__";
    localStorage.setItem(t, "1");
    localStorage.removeItem(t);
  } catch (e) {
    storageWorks = false;
  }

  function loadData() {
    if (storageWorks) {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { /* fall through */ }
    }
    if (memoryFallback) return memoryFallback;
    return defaultData();
  }

  function saveLocal(data) {
    if (storageWorks) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return;
      } catch (e) { /* fall through to memory */ }
    }
    memoryFallback = data;
  }

  let syncTimer = null;
  function saveData(data) {
    saveLocal(data);
    if (!supabaseReady) {
      setSyncStatus("offline");
      return;
    }
    // Debounce writes slightly so rapid taps don't fire a request each
    setSyncStatus("syncing");
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => pushToSupabase(data), 500);
  }

  async function pushToSupabase(data) {
    try {
      const { error } = await supabaseClient
        .from("training_log")
        .upsert({ id: RECORD_ID, data: data, updated_at: new Date().toISOString() });
      if (error) throw error;
      setSyncStatus("synced");
    } catch (e) {
      console.warn("Kunde inte synka mot Supabase:", e);
      setSyncStatus("error");
    }
  }

  async function pullFromSupabase() {
    if (!supabaseReady) return null;
    try {
      const { data: rows, error } = await supabaseClient
        .from("training_log")
        .select("data")
        .eq("id", RECORD_ID)
        .maybeSingle();
      if (error) throw error;
      return rows ? rows.data : null;
    } catch (e) {
      console.warn("Kunde inte hämta från Supabase:", e);
      setSyncStatus("error");
      return null;
    }
  }

  function defaultData() {
    return {
      exercises: {
        "Tryck": [{name: "Armhävningar", archived: false}, {name: "Dips", archived: false}],
        "Drag": [{name: "Chins", archived: false}, {name: "Rodd", archived: false}],
        "Ben": [{name: "Knäböj", archived: false}, {name: "Enbensböj", archived: false}, {name: "Utfall", archived: false}],
        "Core": [{name: "Axeltaps", archived: false}, {name: "Planka", archived: false}]
      },
      weeks: {}
    };
  }

  // Migrates older saved data (plain string exercise names) to the
  // {name, archived} object format, so nobody's existing log breaks.
  function migrateExercises(exercises) {
    Object.keys(exercises).forEach(cat => {
      exercises[cat] = exercises[cat].map(ex => {
        if (typeof ex === "string") return { name: ex, archived: false };
        if (typeof ex.archived !== "boolean") ex.archived = false;
        return ex;
      });
    });
    return exercises;
  }

  let data = loadData();
  // Make sure structure is sane even if old data is malformed
  if (!data.exercises) data.exercises = defaultData().exercises;
  if (!data.weeks) data.weeks = {};
  data.exercises = migrateExercises(data.exercises);

  // ---------- Date / ISO week helpers ----------
  const DAYS = ["Mån", "Tis", "Ons", "Tor", "Fre", "Lör", "Sön"];

  function isoWeekInfo(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = (d.getUTCDay() + 6) % 7; // Mon=0..Sun=6
    d.setUTCDate(d.getUTCDate() - dayNum + 3); // Thursday of this week
    const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
    const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
    firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
    const week = 1 + Math.round((d - firstThursday) / (7 * 86400000));
    return { year: d.getUTCFullYear(), week: week };
  }

  function weekKey(date) {
    const info = isoWeekInfo(date);
    return info.year + "-W" + String(info.week).padStart(2, "0");
  }

  function mondayOf(date) {
    const d = new Date(date);
    const dayNum = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - dayNum);
    d.setHours(0,0,0,0);
    return d;
  }

  function fmtShort(date) {
    return date.getDate() + "/" + (date.getMonth() + 1);
  }

  // ---------- App state ----------
  let viewDate = new Date(); // any date within the viewed week
  let activeDayIndex = (function() {
    const n = (new Date().getDay() + 6) % 7;
    return n;
  })();

  function currentWeekKey() {
    return weekKey(viewDate);
  }

  function ensureWeek(key) {
    if (!data.weeks[key]) data.weeks[key] = {};
    return data.weeks[key];
  }

  function getDayData(dayLabel) {
    const wk = ensureWeek(currentWeekKey());
    if (!wk[dayLabel]) wk[dayLabel] = {};
    return wk[dayLabel];
  }

  // ---------- Rendering ----------
  const dayTabsEl = document.getElementById("dayTabs");
  const weekLabelEl = document.getElementById("weekLabel");
  const categoriesEl = document.getElementById("categories");
  const summaryBody = document.getElementById("summaryBody");
  const summaryWeekLabelEl = document.getElementById("summaryWeekLabel");

  function render() {
    renderWeekLabel();
    renderDayTabs();
    renderCategories();
    renderSummary();
  }

  function renderWeekLabel() {
    const info = isoWeekInfo(viewDate);
    weekLabelEl.textContent = "Vecka " + info.week + ", " + info.year;
  }

  function isSameDate(a, b) {
    return a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();
  }

  function dayHasData(dayLabel) {
    const wk = data.weeks[currentWeekKey()];
    if (!wk || !wk[dayLabel]) return false;
    return Object.keys(wk[dayLabel]).some(exName => (wk[dayLabel][exName] || []).length > 0);
  }

  function renderDayTabs() {
    dayTabsEl.innerHTML = "";
    const mon = mondayOf(viewDate);
    const today = new Date();
    DAYS.forEach((label, idx) => {
      const d = new Date(mon);
      d.setDate(mon.getDate() + idx);
      const tab = document.createElement("div");
      let cls = "day-tab";
      if (idx === activeDayIndex) cls += " active";
      if (isSameDate(d, today)) cls += " is-today";
      tab.className = cls;
      const dot = dayHasData(label) ? '<span class="day-dot"></span>' : "";
      tab.innerHTML = label + dot + '<span class="dsub">' + fmtShort(d) + "</span>";
      tab.addEventListener("click", () => {
        activeDayIndex = idx;
        render();
      });
      dayTabsEl.appendChild(tab);
    });
  }

  function weekTotalsForExercise(exName, wKey) {
    const wk = data.weeks[wKey || currentWeekKey()] || {};
    let sum = 0, sets = 0;
    DAYS.forEach(day => {
      const arr = (wk[day] && wk[day][exName]) || [];
      arr.forEach(v => { sum += v; sets += 1; });
    });
    return { sum, sets };
  }

  function renderCategories() {
    categoriesEl.innerHTML = "";
    const dayLabel = DAYS[activeDayIndex];
    const dayData = getDayData(dayLabel);

    Object.keys(data.exercises).forEach(catName => {
      const exList = data.exercises[catName];
      const activeList = exList.filter(ex => !ex.archived);
      const archivedList = exList.filter(ex => ex.archived);

      // category totals for the week — includes archived exercises too,
      // so history stays correct even after an exercise is archived.
      let catSum = 0, catSets = 0;
      exList.forEach(ex => {
        const t = weekTotalsForExercise(ex.name);
        catSum += t.sum; catSets += t.sets;
      });

      const catEl = document.createElement("div");
      catEl.className = "category";

      const header = document.createElement("div");
      header.className = "category-header";
      header.innerHTML = '<span class="cat-name">' + catName + '</span>' +
        '<span class="cat-totals">' + catSum + ' reps · ' + catSets + ' set</span>';
      catEl.appendChild(header);

      activeList.forEach(ex => {
        const exName = ex.name;
        const exEl = document.createElement("div");
        exEl.className = "exercise";

        const t = weekTotalsForExercise(exName);
        const top = document.createElement("div");
        top.className = "exercise-top";
        const nameSpan = document.createElement("span");
        nameSpan.className = "exercise-name";
        nameSpan.textContent = exName;
        const totalSpan = document.createElement("span");
        totalSpan.className = "exercise-week-total";
        totalSpan.textContent = t.sum + " reps · " + t.sets + " set (v.)";
        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-ex-btn";
        removeBtn.textContent = "✕";
        removeBtn.title = "Ta bort " + exName;
        removeBtn.addEventListener("click", () => {
          const ok = confirm(
            'Ta bort "' + exName + '"?\n\n' +
            "Den försvinner från listan, men all historik du redan loggat sparas " +
            "och räknas fortfarande med i gamla veckors summering. Du kan ta fram " +
            'den igen senare under "Arkiverade övningar".'
          );
          if (ok) {
            ex.archived = true;
            saveData(data);
            render();
          }
        });
        top.appendChild(nameSpan);
        top.appendChild(totalSpan);
        top.appendChild(removeBtn);
        exEl.appendChild(top);

        const chipsWrap = document.createElement("div");
        chipsWrap.className = "set-chips";
        const sets = dayData[exName] || [];
        sets.forEach((val, i) => {
          const chip = document.createElement("div");
          chip.className = "chip";
          chip.innerHTML = "<span>" + val + "</span>";
          const rm = document.createElement("button");
          rm.textContent = "✕";
          rm.addEventListener("click", () => {
            sets.splice(i, 1);
            dayData[exName] = sets;
            saveData(data);
            render();
          });
          chip.appendChild(rm);
          chipsWrap.appendChild(chip);
        });
        exEl.appendChild(chipsWrap);

        const addRow = document.createElement("div");
        addRow.className = "add-set-row";
        const input = document.createElement("input");
        input.type = "number";
        input.inputMode = "numeric";
        input.placeholder = "Reps";
        const addBtn = document.createElement("button");
        addBtn.textContent = "+";
        function commit() {
          const val = parseInt(input.value, 10);
          if (!isNaN(val) && val >= 0) {
            const arr = dayData[exName] || [];
            arr.push(val);
            dayData[exName] = arr;
            saveData(data);
            input.value = "";
            render();
          }
        }
        addBtn.addEventListener("click", commit);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") commit(); });
        addRow.appendChild(input);
        addRow.appendChild(addBtn);
        exEl.appendChild(addRow);

        catEl.appendChild(exEl);
      });

      const addExRow = document.createElement("div");
      addExRow.className = "add-exercise";
      const addExBtn = document.createElement("button");
      addExBtn.textContent = "+ Lägg till övning i " + catName;
      addExBtn.addEventListener("click", () => {
        const name = prompt("Namn på ny övning i " + catName + ":");
        if (name && name.trim()) {
          data.exercises[catName].push({ name: name.trim(), archived: false });
          saveData(data);
          render();
        }
      });
      addExRow.appendChild(addExBtn);
      catEl.appendChild(addExRow);

      if (archivedList.length > 0) {
        const archWrap = document.createElement("div");
        archWrap.className = "archived-wrap";
        const archToggle = document.createElement("button");
        archToggle.className = "archived-toggle";
        archToggle.textContent = "Arkiverade övningar (" + archivedList.length + ") ▾";
        const archBody = document.createElement("div");
        archBody.className = "archived-body";
        archBody.style.display = "none";
        archToggle.addEventListener("click", () => {
          const open = archBody.style.display !== "none";
          archBody.style.display = open ? "none" : "block";
          archToggle.textContent = "Arkiverade övningar (" + archivedList.length + ") " + (open ? "▾" : "▴");
        });
        archivedList.forEach(ex => {
          const row = document.createElement("div");
          row.className = "archived-row";
          const label = document.createElement("span");
          label.textContent = ex.name;
          const btnGroup = document.createElement("div");
          btnGroup.className = "archived-btn-group";
          const restoreBtn = document.createElement("button");
          restoreBtn.textContent = "Visa igen";
          restoreBtn.addEventListener("click", () => {
            ex.archived = false;
            saveData(data);
            render();
          });
          const purgeBtn = document.createElement("button");
          purgeBtn.className = "purge-btn";
          purgeBtn.textContent = "Ta bort permanent";
          purgeBtn.addEventListener("click", () => {
            const ok = confirm(
              'Ta bort "' + ex.name + '" PERMANENT?\n\n' +
              "Detta går inte att ångra. All historik för den här övningen " +
              "raderas ur alla veckor, och den försvinner helt från appen och databasen."
            );
            if (!ok) return;
            // Remove the exercise definition itself
            data.exercises[catName] = data.exercises[catName].filter(e => e !== ex);
            // Purge every logged set for this exercise name, from every week/day
            Object.keys(data.weeks).forEach(wk => {
              const week = data.weeks[wk];
              Object.keys(week).forEach(day => {
                if (week[day] && Object.prototype.hasOwnProperty.call(week[day], ex.name)) {
                  delete week[day][ex.name];
                }
              });
            });
            saveData(data);
            render();
          });
          btnGroup.appendChild(restoreBtn);
          btnGroup.appendChild(purgeBtn);
          row.appendChild(label);
          row.appendChild(btnGroup);
          archBody.appendChild(row);
        });
        archWrap.appendChild(archToggle);
        archWrap.appendChild(archBody);
        catEl.appendChild(archWrap);
      }

      categoriesEl.appendChild(catEl);
    });
  }

  function renderSummary() {
    const info = isoWeekInfo(viewDate);
    summaryWeekLabelEl.textContent = "Vecka " + info.week + ", " + info.year;
    summaryBody.innerHTML = "";
    Object.keys(data.exercises).forEach(catName => {
      const exList = data.exercises[catName];
      let catSum = 0, catSets = 0;
      exList.forEach(ex => {
        const t = weekTotalsForExercise(ex.name);
        catSum += t.sum; catSets += t.sets;
        const row = document.createElement("tr");
        const nameLabel = ex.name + (ex.archived ? " (arkiverad)" : "");
        row.innerHTML = "<td>" + nameLabel + "</td><td>" + t.sum + "</td><td>" + t.sets + "</td>";
        summaryBody.appendChild(row);
      });
      const catRow = document.createElement("tr");
      catRow.className = "cat-row";
      catRow.innerHTML = "<td>" + catName + "</td><td>" + catSum + "</td><td>" + catSets + "</td>";
      summaryBody.appendChild(catRow);
    });
  }

  // ---------- Controls ----------
  document.getElementById("prevWeek").addEventListener("click", () => {
    viewDate.setDate(viewDate.getDate() - 7);
    viewDate = new Date(viewDate);
    render();
  });
  document.getElementById("nextWeek").addEventListener("click", () => {
    viewDate.setDate(viewDate.getDate() + 7);
    viewDate = new Date(viewDate);
    render();
  });
  document.getElementById("jumpToday").addEventListener("click", () => {
    viewDate = new Date();
    activeDayIndex = (new Date().getDay() + 6) % 7;
    render();
  });
  document.getElementById("toggleSummary").addEventListener("click", (e) => {
    const block = document.getElementById("summaryBlock");
    block.classList.toggle("open");
    e.target.textContent = block.classList.contains("open")
      ? "Dölj veckans summering ▴"
      : "Visa veckans summering ▾";
  });

  // ---------- Statistics ----------
  const CATS = ["Tryck", "Drag", "Ben", "Core"];
  // Okabe-Ito palette — designed to stay distinguishable across all common
  // forms of color blindness. Line dash + point shape give a second,
  // color-independent way to tell categories apart.
  const CAT_COLORS = {
    Tryck: "#E69F00", // orange
    Drag: "#0072B2",  // deep blue
    Ben: "#009E73",   // bluish green
    Core: "#CC79A7"   // reddish purple/pink — kept away from orange on purpose
  };
  const CAT_DASH = {
    Tryck: [],
    Drag: [8, 4],
    Ben: [2, 3],
    Core: [8, 3, 2, 3]
  };
  const CAT_POINT_STYLE = {
    Tryck: "circle",
    Drag: "triangle",
    Ben: "rect",
    Core: "rectRot"
  };

  let statsRange = "10"; // "4" | "10" | "year"
  let setsChartInstance = null;
  let repsChartInstance = null;
  let exerciseChartInstances = [];

  function weekLabelFromKey(key) {
    const parts = key.split("-W");
    return "v" + parseInt(parts[1], 10);
  }

  // Ordered oldest -> newest list of {key, label} for the selected range,
  // anchored on today's real date (not whatever week is open in Logg-vyn).
  function getStatsWeekKeys(range) {
    const today = new Date();
    const todayInfo = isoWeekInfo(today);
    const n = range === "year" ? todayInfo.week : parseInt(range, 10);
    const collected = [];
    let cursor = new Date(today);
    for (let i = 0; i < n; i++) {
      const info = isoWeekInfo(cursor);
      collected.push({
        key: info.year + "-W" + String(info.week).padStart(2, "0"),
        label: "v" + info.week
      });
      cursor.setDate(cursor.getDate() - 7);
    }
    collected.reverse();
    return collected;
  }

  function categoryTotalsForWeek(weekKeyStr) {
    const totals = {};
    CATS.forEach(cat => { totals[cat] = { sum: 0, sets: 0 }; });
    CATS.forEach(cat => {
      (data.exercises[cat] || []).forEach(ex => {
        const t = weekTotalsForExercise(ex.name, weekKeyStr);
        totals[cat].sum += t.sum;
        totals[cat].sets += t.sets;
      });
    });
    return totals;
  }

  function allActiveExercises() {
    const list = [];
    CATS.forEach(cat => {
      (data.exercises[cat] || []).forEach(ex => {
        if (!ex.archived) list.push({ cat, name: ex.name });
      });
    });
    return list;
  }

  function findPR(exName) {
    let best = null;
    Object.keys(data.weeks).forEach(wk => {
      const week = data.weeks[wk];
      Object.keys(week).forEach(day => {
        const arr = (week[day] && week[day][exName]) || [];
        arr.forEach(v => {
          if (!best || v > best.value) best = { value: v, week: wk };
        });
      });
    });
    return best;
  }

  function renderStats() {
    const weeks = getStatsWeekKeys(statsRange);
    renderCategoryCharts(weeks);
    renderStatsTable(weeks);
    renderExerciseProgression(weeks);
  }

  function renderCategoryCharts(weeks) {
    const labels = weeks.map(w => w.label);
    const setsDatasets = CATS.map(cat => ({
      label: cat,
      data: weeks.map(w => categoryTotalsForWeek(w.key)[cat].sets),
      borderColor: CAT_COLORS[cat],
      backgroundColor: CAT_COLORS[cat],
      borderDash: CAT_DASH[cat],
      pointStyle: CAT_POINT_STYLE[cat],
      pointRadius: 4,
      pointHoverRadius: 6,
      borderWidth: 2.5,
      tension: 0.25,
      fill: false
    }));
    const repsDatasets = CATS.map(cat => ({
      label: cat,
      data: weeks.map(w => categoryTotalsForWeek(w.key)[cat].sum),
      borderColor: CAT_COLORS[cat],
      backgroundColor: CAT_COLORS[cat],
      borderDash: CAT_DASH[cat],
      pointStyle: CAT_POINT_STYLE[cat],
      pointRadius: 4,
      pointHoverRadius: 6,
      borderWidth: 2.5,
      tension: 0.25,
      fill: false
    }));

    const commonOptions = {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { ticks: { color: "#9a9a9a", font: { size: 10 }, maxRotation: 0 }, grid: { display: false } },
        y: { beginAtZero: true, ticks: { color: "#9a9a9a", font: { size: 10 } }, grid: { color: "#3a3a3a" } }
      },
      plugins: {
        legend: { labels: { color: "#eaeaea", boxWidth: 12, font: { size: 11 }, usePointStyle: true } },
        tooltip: { mode: "index", intersect: false }
      }
    };

    if (setsChartInstance) setsChartInstance.destroy();
    setsChartInstance = new Chart(document.getElementById("setsChart").getContext("2d"), {
      type: "line",
      data: { labels, datasets: setsDatasets },
      options: commonOptions
    });

    if (repsChartInstance) repsChartInstance.destroy();
    repsChartInstance = new Chart(document.getElementById("repsChart").getContext("2d"), {
      type: "line",
      data: { labels, datasets: repsDatasets },
      options: commonOptions
    });
  }

  function renderStatsTable(weeks) {
    const table = document.getElementById("statsTable");
    let html = "<thead><tr><th>Vecka</th>";
    CATS.forEach(cat => { html += "<th>" + cat + "</th>"; });
    html += "</tr></thead><tbody>";
    weeks.slice().reverse().forEach(w => {
      const t = categoryTotalsForWeek(w.key);
      html += "<tr><td>" + w.label + "</td>";
      CATS.forEach(cat => { html += "<td>" + t[cat].sets + "</td>"; });
      html += "</tr>";
    });
    html += "</tbody>";
    table.innerHTML = html;
  }

  function renderExerciseProgression(weeks) {
    const container = document.getElementById("exerciseCards");
    container.innerHTML = "";
    exerciseChartInstances.forEach(c => c.destroy());
    exerciseChartInstances = [];

    allActiveExercises().forEach(ex => {
      const pr = findPR(ex.name);
      const prText = pr ? pr.value + " reps (bästa set, " + weekLabelFromKey(pr.week) + ")" : "Ingen data ännu";

      const card = document.createElement("div");
      card.className = "ex-card";

      const top = document.createElement("div");
      top.className = "ex-card-top";
      top.innerHTML =
        '<span class="ex-title">' + ex.name + '</span>' +
        '<span class="ex-pr">' + prText + '</span>';
      card.appendChild(top);

      const chartWrap = document.createElement("div");
      chartWrap.className = "ex-chart-wrap";
      const canvas = document.createElement("canvas");
      chartWrap.appendChild(canvas);
      card.appendChild(chartWrap);
      container.appendChild(card);

      const repsData = weeks.map(w => weekTotalsForExercise(ex.name, w.key).sum);
      const chart = new Chart(canvas.getContext("2d"), {
        type: "line",
        data: {
          labels: weeks.map(w => w.label),
          datasets: [{
            data: repsData,
            borderColor: CAT_COLORS[ex.cat] || "#ff8c00",
            backgroundColor: "rgba(255,140,0,0.12)",
            fill: true,
            tension: 0.3,
            pointRadius: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: true } },
          scales: {
            x: { ticks: { color: "#9a9a9a", font: { size: 9 }, maxTicksLimit: 6 }, grid: { display: false } },
            y: { ticks: { color: "#9a9a9a", font: { size: 9 } }, grid: { color: "#3a3a3a" }, beginAtZero: true }
          }
        }
      });
      exerciseChartInstances.push(chart);
    });
  }

  function statsViewVisible() {
    return document.getElementById("statsView").style.display !== "none";
  }

  // ---------- Nav switching ----------
  document.getElementById("navLog").addEventListener("click", () => {
    document.getElementById("navLog").classList.add("active");
    document.getElementById("navStats").classList.remove("active");
    document.getElementById("logView").style.display = "";
    document.getElementById("statsView").style.display = "none";
  });
  document.getElementById("navStats").addEventListener("click", () => {
    document.getElementById("navStats").classList.add("active");
    document.getElementById("navLog").classList.remove("active");
    document.getElementById("logView").style.display = "none";
    document.getElementById("statsView").style.display = "";
    renderStats();
  });

  document.querySelectorAll(".range-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".range-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      statsRange = btn.dataset.range;
      renderStats();
    });
  });

  document.getElementById("toggleStatsTable").addEventListener("click", (e) => {
    const block = document.getElementById("statsTableBlock");
    block.classList.toggle("open");
    e.target.textContent = block.classList.contains("open") ? "Dölj veckotabell ▴" : "Visa veckotabell ▾";
  });

  document.getElementById("toggleExerciseStats").addEventListener("click", (e) => {
    const block = document.getElementById("exerciseStatsBlock");
    block.classList.toggle("open");
    e.target.textContent = block.classList.contains("open") ? "Progression per övning ▴" : "Progression per övning ▾";
  });

  // ---------- Startup ----------
  render(); // instant paint with whatever's local, so the app feels snappy

  if (supabaseReady) {
    setSyncStatus("syncing");
    pullFromSupabase().then(remote => {
      if (remote) {
        data = remote;
        if (!data.exercises) data.exercises = defaultData().exercises;
        if (!data.weeks) data.weeks = {};
        data.exercises = migrateExercises(data.exercises);
        saveLocal(data);
        render();
        if (statsViewVisible()) renderStats();
      } else {
        // Nothing in the cloud yet (first run) — push what we have locally
        pushToSupabase(data);
      }
      setSyncStatus("synced");
    });
  } else {
    setSyncStatus("offline");
  }
})();
</script>

</body>
</html>
